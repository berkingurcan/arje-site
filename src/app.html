<!doctype html>
<html lang="%lang%" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#EEEAE3" />
		<meta name="format-detection" content="telephone=no" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="ARJE" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="application-name" content="ARJE" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/brand/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/brand/favicon-32.png" type="image/png" sizes="32x32" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/brand/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/brand/site.webmanifest" />
		<link rel="preconnect" href="https://images.unsplash.com" crossorigin />
		<script>
			// Apply the saved theme before first paint (no flash). Light is the brand default.
			(function () {
				var d = document.documentElement;
				d.classList.add('js');
				try {
					var t = localStorage.getItem('arje-theme');
					if (t === 'dark' || t === 'light') d.setAttribute('data-theme', t);
					if (t === 'dark') document.querySelector('meta[name=theme-color]').setAttribute('content', '#2A0E16');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
